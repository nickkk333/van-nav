openapi: 3.1.0
info:
  title: Van Nav API
  description: Van Nav 导航系统的 API 文档
  version: 1.0.0

servers:
  - url: http://localhost:6412
    description: 开发环境服务器

components:
  schemas:
    Tool:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        logo:
          type: string
          description: 图标地址（http 外链或本地图片地址），不含图片内容
        catelog:
          type: string
          description: 所属分类名称
        desc:
          type: string
        sort:
          type: integer
          description: 排序值，从 1 开始依次递增
        hide:
          type: boolean
        default:
          type: boolean
          description: 是否展示在主页默认栏

    AddToolDto:
      type: object
      required:
        - name
        - url
      properties:
        name:
          type: string
        url:
          type: string
        logo:
          type: string
        desc:
          type: string
        catelogId:
          type: integer
        sort:
          type: integer
          description: >-
            新建工具的排序落点：-1（默认）或负数排到最后；0 或留空排到最前；正数插入到该序号位置。
            落位后后端会把所有工具的排序值重排成从 1 开始依次递增

    UpdateToolDto:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        name:
          type: string
        url:
          type: string
        logo:
          type: string
        desc:
          type: string
        catelogId:
          type: integer

    Catelog:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sort:
          type: integer
        hide:
          type: boolean
        default:
          type: boolean
          description: 该分类下的工具是否展示在主页默认栏

    UpdateCatelogDto:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
        name:
          type: string
        sort:
          type: integer
        hide:
          type: boolean
          description: 变化时会同步该分类下所有工具的隐藏状态
        default:
          type: boolean
          description: 变化时会同步该分类下所有工具的默认栏展示状态

    Setting:
      type: object
      properties:
        id:
          type: integer
        favicon:
          type: string
        title:
          type: string
        govRecord:
          type: string
        logo192:
          type: string
        logo512:
          type: string
        hideAdmin:
          type: boolean
        hideGithub:
          type: boolean
        hideToggleJumpTarget:
          type: boolean
        jumpTargetBlank:
          type: boolean
        backgroundImage:
          type: string
          description: >-
            首页背景图地址，可为后台上传接口返回的 url 或外链地址。
            留空时前台会使用服务端保存的必应每日壁纸（/api/bingWallpaper）

    SiteConfig:
      description: 站点展示配置
      type: object
      properties:
        id:
          type: integer
        noImageMode:
          type: boolean
        compactMode:
          type: boolean
        cardsPerRow:
          type: integer
          description: 首页每行展示的网站数量，取值 1-12，默认 5
          minimum: 1
          maximum: 12

    LoginDto:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
        password:
          type: string

    UpdateUserDto:
      type: object
      required:
        - name
        - password
      properties:
        name:
          type: string
        password:
          type: string

    ApiToken:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        disabled:
          type: integer

    AddTokenDto:
      type: object
      required:
        - name
      properties:
        name:
          type: string

    SearchEngine:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        baseUrl:
          type: string
        queryParam:
          type: string
        logo:
          type: string
          description: 图标地址（http 外链、已保存到本地的地址或内置图标文件名）
        sort:
          type: integer
        enabled:
          type: boolean

    BackupData:
      description: >-
        导入导出的备份数据，包含所有工具、分类、搜索引擎与 api token。
        图标只保存网址（不含图片内容），导入后服务端会按网址自动获取图片
      type: object
      properties:
        version:
          type: integer
          description: 备份文件格式版本，当前为 1
        exportedAt:
          type: string
          description: 导出时间（RFC3339）
        tools:
          type: array
          items:
            $ref: "#/components/schemas/Tool"
        catelogs:
          type: array
          items:
            $ref: "#/components/schemas/Catelog"
        searchEngines:
          type: array
          items:
            $ref: "#/components/schemas/SearchEngine"
        apiTokens:
          type: array
          items:
            $ref: "#/components/schemas/ApiToken"

    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        errorMessage:
          type: string

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /api/login:
    post:
      security: []
      summary: 用户登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            type: object
                          token:
                            type: string

  /api/logout:
    get:
      security: []
      summary: 用户登出
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/:
    get:
      security: []
      summary: 获取所有数据
      responses:
        "200":
          description: 成功获取所有数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tools:
                            type: array
                            items:
                              $ref: "#/components/schemas/Tool"
                          catelogs:
                            description: 分类名称列表（前台标签使用）
                            type: array
                            items:
                              type: string
                          setting:
                            $ref: "#/components/schemas/Setting"
                          siteConfig:
                            $ref: "#/components/schemas/SiteConfig"

  /api/admin/all:
    get:
      summary: 管理员获取所有数据
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功获取所有数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tools:
                            type: array
                            items:
                              $ref: "#/components/schemas/Tool"
                          catelogs:
                            type: array
                            items:
                              $ref: "#/components/schemas/Catelog"
                          setting:
                            $ref: "#/components/schemas/Setting"
                          user:
                            type: object
                            properties:
                              name:
                                type: string
                              id:
                                type: string
                          tokens:
                            type: array
                            items:
                              $ref: "#/components/schemas/ApiToken"

  /api/admin/exportTools:
    get:
      summary: 导出所有工具（兼容旧接口，仅工具）
      description: 只导出工具列表，完整备份请使用 GET /api/admin/exportAll
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功导出工具列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/Tool"

  /api/admin/importTools:
    post:
      summary: 导入工具列表（兼容旧接口，仅工具）
      description: >-
        只导入工具（同 id 覆盖，未出现在请求里的工具保持不动），不会改动分类、搜索引擎与 api token，
        完整备份请使用 POST /api/admin/importAll
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Tool"
      responses:
        "200":
          description: 导入成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/exportAll:
    get:
      summary: 导出全部数据（工具、分类、搜索引擎、API Token）
      description: >-
        导出所有工具、分类、搜索引擎与 api token，返回内容可直接作为 POST /api/admin/importAll 的请求体。
        图标只保存网址（http 外链或本地图片地址），不包含图片内容，导入后由服务端按网址自动获取图片
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功导出全部数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/BackupData"

  /api/admin/importAll:
    post:
      summary: 导入全部数据（工具、分类、搜索引擎、API Token）
      description: >-
        导入备份数据：同 id 的工具、搜索引擎与 api token 会被覆盖，分类按名称合并，
        未出现在备份里的记录保持不动；导入完成后服务端会异步按图标网址重新获取图片。
        同时兼容旧版只包含工具数组的导出文件
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupData"
      responses:
        "200":
          description: 导入成功，data 中返回各类型数据导入的条数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          tools:
                            type: integer
                          catelogs:
                            type: integer
                          searchEngines:
                            type: integer
                          apiTokens:
                            type: integer
        "400":
          description: 请求参数错误或备份文件内容为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/img:
    get:
      security: []
      summary: 获取 logo 图片
      description: >-
        只从数据库的图片缓存里取图标（外链图标在保存工具时下载并缓存到数据库），缓存里没有图片时返回 404，
        前台 <img> 会触发 error 事件并用名称首字符占位。
        内置图标文件名（例如 baidu.ico）是随前端一起内嵌的静态资源（源文件在 ui/public 目录），
        前端按网站根目录的相对路径直接请求静态资源，不经过这个接口。
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功获取图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: 图片不存在（缓存里没有，例如外链失效或没下载成功）

  /api/uploadedImage/{name}:
    get:
      security: []
      summary: 获取后台上传的图片
      description: 后台通过 /api/admin/uploadImage 上传的图片，按文件名访问
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 成功获取图片
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: 图片不存在

  /api/bingWallpaper:
    get:
      security: []
      summary: 获取必应每日壁纸
      description: >-
        返回服务端保存到 data 目录的必应每日壁纸（文件名为「必应壁纸-YYYYMMDD-图片描述 + 图片格式后缀」）。
        服务端启动时会自动下载当天的壁纸，前台未配置首页背景图时用它作为全屏背景图；
        本地还没有图片时会先同步下载一次再返回，下载失败返回 404。
      responses:
        "200":
          description: 成功获取必应每日壁纸
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: 壁纸不存在（下载失败或未联网）

  /api/bingWallpaperInfo:
    get:
      security: []
      summary: 获取必应每日壁纸的图片描述
      description: >-
        从当前壁纸文件名（必应壁纸-YYYYMMDD-图片描述.后缀）解析出图片描述，
        前台把它显示在首页搜索框的 placeholder 上；本地还没有壁纸时先同步下载一次，
        拿不到描述（老命名、无描述等）时 title 返回空字符串。
      responses:
        "200":
          description: 成功获取壁纸信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      title:
                        type: string
                        description: 图片描述，为空时前台显示默认提示

  /manifest.json:
    get:
      security: []
      summary: 获取 PWA manifest
      responses:
        "200":
          description: 成功获取 manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  short_name:
                    type: string
                  name:
                    type: string
                  icons:
                    type: array
                    items:
                      type: object
                      properties:
                        src:
                          type: string
                        type:
                          type: string
                        sizes:
                          type: string
                  start_url:
                    type: string
                  display:
                    type: string
                  scope:
                    type: string
                  theme_color:
                    type: string
                  background_color:
                    type: string

  /api/admin/tool:
    post:
      summary: 添加新工具
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToolDto"
      responses:
        "200":
          description: 添加成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/tool/{id}:
    delete:
      summary: 删除工具
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

    put:
      summary: 更新工具
      description: >-
        更新工具信息。请求体里的 logo（图标网址）有改动时后端会重新获取图标：
        填图片地址（http://、https:// 开头的图片链接）时先按这个地址把图片下载保存到 data/images
        （文件名用工具名称）并保留填写的图标网址；按填写的地址拿不到图片、或改成空与其他内容时，
        改按工具网址抓取网站图标（抓不到用 gstatic 兜底）并下载。获取成功时 logo 写入图标网址、
        logo_name 写入保存的图片文件名；都拿不到时两个字段都置空，前台显示默认图标 default.png。
        另外，logo_name 传空时即使图标网址没变也会强制按工具网址重新抓取图标（用于「重置缓存图标」）
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolDto"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/tool/{id}/logo:
    post:
      summary: 给工具上传本地图标
      description: >-
        给指定工具上传一张本地图片当图标，后端按「工具名称 + 图片后缀」把图片保存到 data/images 目录
        （命名规则与按网址自动下载的图标一致），并把该工具的图标网址（logo）改成本地图片地址
        （/api/uploadedImage/{name}）、logo 图片名（logo_name）改成保存后的文件名。
        单张图片不超过 5MB，支持 png / jpg / jpeg / webp / gif / svg / ico；
        上传后原来保存的本地图标图片如果没有别的工具在用，会被清理掉。
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 工具 id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 图标图片文件
      responses:
        "200":
          description: 上传成功（图标网址与 logo 图片名已更新）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          name:
                            type: string
                            description: 保存到 data/images 后的图片文件名（工具表的 logo_name）
                          url:
                            type: string
                            description: 图片的本地访问地址（/api/uploadedImage/{name}）
        "400":
          description: 未选择图片、格式不支持或图片过大
        "404":
          description: 工具不存在

  /api/admin/catelog:
    post:
      summary: 添加新分类
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                sort:
                  type: integer
                  description: >-
                    新建分类的排序落点：-1（默认）或负数排到最后；0 或留空排到最前；正数插入到该序号位置。
                    落位后后端会把所有分类的排序值重排成从 1 开始依次递增
                hide:
                  type: boolean
                default:
                  type: boolean
                  description: 该分类下的工具是否展示在主页默认栏
      responses:
        "200":
          description: 添加分类成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/catelog/{id}:
    delete:
      summary: 删除分类
      description: 删除分类时会同步删除该分类下的所有工具
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除分类成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

    put:
      summary: 更新分类
      description: 分类名称变更时同步修改该分类下工具的分类名称；隐藏状态、默认开关变化时分别同步该分类下所有工具的隐藏状态与默认栏展示状态；保存后自动把所有分类的排序值重排为从 1 开始依次递增
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCatelogDto"
      responses:
        "200":
          description: 更新分类成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/catelogs/sort:
    put:
      summary: 批量更新分类排序
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  sort:
                    type: integer
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/admin/apiToken:
    post:
      summary: 添加 API Token
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTokenDto"
      responses:
        "200":
          description: 添加 Token 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          value:
                            type: string
                          name:
                            type: string

  /api/admin/apiToken/{id}:
    delete:
      summary: 删除 API Token
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 删除 Token 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/setting:
    put:
      summary: 更新系统设置
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Setting"
      responses:
        "200":
          description: 更新设置成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/uploadImage:
    post:
      summary: 上传图片
      description: >-
        上传背景图 / logo 等图片，成功后在 data 目录下的 images 文件夹中保存文件，
        并通过返回的 url（/api/uploadedImage/{name}）访问。单张图片不超过 5MB，
        支持 png / jpg / jpeg / webp / gif / svg / ico
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: 上传成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url:
                            type: string
        "400":
          description: 未选择图片、格式不支持或图片过大

  /api/admin/searchEngine/logo:
    post:
      summary: 把搜索引擎 logo 下载保存到本地
      description: >-
        传入搜索引擎名称与 logo 地址（外链），后端会下载图片并以「搜索引擎名称 + 图片格式后缀」保存到 data/images 目录，
        返回可直接访问的本地地址（/api/uploadedImage/{name}），之后展示时直接读取本地图片，不再访问外链。
        传入的 logo 不是 http(s) 外链（内置图标文件名或已保存到本地的地址）时不做处理，返回空地址。
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - logo
              properties:
                name:
                  type: string
                  description: 搜索引擎名称，用于命名本地图片文件
                logo:
                  type: string
                  description: logo 外链地址（http/https）
      responses:
        "200":
          description: 保存成功（非外链时 data.url 为空字符串）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/StandardResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url:
                            type: string
        "400":
          description: 参数错误或 logo 下载失败

  /api/admin/user:
    put:
      summary: 更新用户信息
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserDto"
      responses:
        "200":
          description: 更新用户信息成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"

  /api/admin/tools/sort:
    put:
      summary: 批量更新工具排序
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  sort:
                    type: integer
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
        "400":
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
security:
  - BearerAuth: []
