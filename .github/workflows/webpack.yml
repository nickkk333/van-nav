name: NodeJS with Webpack

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22' # 升级到 Node 22
        cache: 'pnpm'    
        
    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 9 # 使用新版 pnpm
        run_install: false
          
    - name: Build
      run: |
        npm install
        npx webpack
        echo "清空原有数据"
        rm -rf ./public
        mkdir -p public
        echo '构建用户页面'
        cd ui && CI=false pnpm install && CI=false pnpm build && cd ..
        cp -r ui/build/* public/
        echo '构建前端数据完成'
        ls public/static
