name: GoReleaser Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 允许创建 Release 和上传资产

jobs:
  goreleaser:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 运行器，性能更好
    steps:
      # 1. 拉取代码 (关键：fetch-depth: 0)
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置 Node 环境并缓存依赖
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18" # 建议使用 LTS 版本，或者指定具体小版本
          cache: 'pnpm' # 自动缓存 pnpm 依赖，大幅加速构建
          cache-dependency-path: ui/pnpm-lock.yaml

      # 3. 设置 Go 环境
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21' # 建议升级到较新版本，除非有特定兼容需求
          cache: true # 缓存 Go 模块依赖

      # 4. 构建前端资源
      - name: Build Frontend Assets
        run: |
          # 安装 pnpm (如果 runner 未预装)
          npm install -g pnpm
          
          # 清理旧的 public 目录
          rm -rf ./public
          mkdir -p public
          
          echo ">>> 开始构建前端..."
          cd ui
          pnpm install --frozen-lockfile # 使用 frozen-lockfile 确保依赖一致性
          pnpm build
          cd ..
          
          # 将构建产物复制到 Go 项目的 public 目录
          # 注意：确保你的 Go 代码中 embed 的路径与此处一致
          cp -r ui/dist/* public/ # 注意：Vite/React 通常输出到 dist，Vue CLI 可能是 build，请根据实际调整
          
          echo ">>> 前端构建完成，文件列表："
          ls -R public/

      # 5. 运行 GoReleaser
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest # 使用最新版，或者指定具体版本如 v1.26.0
          args: release --