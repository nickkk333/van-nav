# ============================================================
# 发布流水线
#   1. 从 .nvmrc 读取统一的 Node 版本，构建 Vue3 前端（产物 ./public）
#   2. GoReleaser 交叉编译单文件程序：Windows / Linux / macOS
#   3. Docker：多架构镜像推送 GHCR，并把 amd64、arm64 离线镜像包上传 Release
#   4. 飞牛OS：按 fnOS .fpk 规范打包（Docker 模式）并上传 Release
# ============================================================
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------- 版本基线
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 版本全局唯一来源：根目录 .nvmrc
      - name: Read Node version
        id: node
        run: echo "node-version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------- Windows / Linux 二进制
  binaries:
    name: Binaries
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.meta.outputs.node-version }}
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build frontend assets
        run: |
          echo ">>> 安装前端依赖"
          npm --prefix ui ci --no-audit --no-fund
          echo ">>> 构建前端（产物输出到 ./public）"
          npm --prefix ui run build
          ls -R public | head -30

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------- Docker 多架构镜像
  docker:
    name: Docker multi-arch image
    runs-on: ubuntu-latest
    needs: meta
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GOPROXY=https://proxy.golang.org,direct
            NODE_VERSION=${{ needs.meta.outputs.node-version }}
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  # ---------------------------------------------------------- Docker 离线镜像包
  docker-offline:
    name: Docker offline image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [meta, binaries]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build offline image tar
        run: |
          set -euo pipefail
          docker buildx build --platform linux/${{ matrix.arch }} --provenance=false --sbom=false \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --build-arg NODE_VERSION=${{ needs.meta.outputs.node-version }} \
            --build-arg VERSION=${{ github.ref_name }} \
            --build-arg COMMIT=${{ github.sha }} \
            -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --output type=docker,dest=van-nav-docker-${{ matrix.arch }}.tar .
          gzip -9 van-nav-docker-${{ matrix.arch }}.tar

      - name: Upload image to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: van-nav-docker-${{ matrix.arch }}.tar.gz

  # ---------------------------------------------------------- 飞牛OS .fpk 包
  fnos:
    name: FnOS fpk (amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve app version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 与本地 make fnos-fpk 共用 packaging/fnos-app/build-fpk.sh：
      # 内部会拉取第三方通用打包框架（生命周期 shared/cmd + build-fpk.sh）
      - name: Build fpk
        run: |
          bash packaging/fnos-app/build-fpk.sh \
            "${{ steps.ver.outputs.version }}" \
            x86 \
            "ghcr.io/${{ github.repository }}:${{ github.ref_name }}" \
            "van-nav-fnos-amd64.fpk"

      - name: Upload fpk to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: van-nav-fnos-amd64.fpk
