# ============================================================
# GoReleaser 配置（version 必须为 2，否则 goreleaser-action@v6 会直接报错）
# CI/CD 构建流程（单文件可执行程序）
# 前端：ui -> 构建产物输出到 ./public（供 go:embed 使用）
# 后端：Go 交叉编译为静态二进制
# ============================================================
version: 2

before:
  hooks:
    - go mod tidy
    # 构建前端（Vite 产物直接输出到 ../public）
    - npm --prefix ui ci --no-audit --no-fund
    - npm --prefix ui run build

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - timetzdata
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm

archives:
  - id: default
    # 固定产物命名，便于流水线按名字抓取 Linux/Windows 包做二次打包
    # 命名示例：van-nav_v1.0.0_linux_amd64.tar.gz / van-nav_v1.0.0_windows_amd64.zip
    # 注意：v2 已移除 replacements 字段，直接用原始 goos/goarch
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "version"
