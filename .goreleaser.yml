# ============================================================
# CI/CD 构建流程（单文件可执行程序）
# 前端：ui -> 构建产物输出到 ./public（供 go:embed 使用）
# 后端：Go 交叉编译为静态二进制
# ============================================================
before:
  hooks:
    - go mod tidy
    # 构建前端（Vite 产物直接输出到 ../public）
    - npm --prefix ui ci --no-audit --no-fund
    - npm --prefix ui run build

builds:
  - env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      - timetzdata
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    ignore:
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: arm

archives:
  - replacements:
      darwin: MacOs
      linux: Linux
      windows: Windows
      amd64: x86_64
      "386": x86

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "version"
